name: RDP with ngrok
on: [push]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Download ngrok v3
        run: |
          Invoke-WebRequest https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-windows-amd64.zip -OutFile ngrok.zip
          Expand-Archive ngrok.zip -DestinationPath ngrok
          echo "${{ github.workspace }}\ngrok" | Out-File -Append -FilePath $env:GITHUB_PATH
        shell: pwsh

      - name: Add ngrok authtoken
        run: |
          ngrok config add-authtoken $env:NGROK_AUTH_TOKEN
        env:
          NGROK_AUTH_TOKEN: ${{ secrets.NGROK_AUTH_TOKEN }}
        shell: pwsh

      - name: Enable RDP and firewall
        run: |
          Set-ItemProperty -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" -Name "UserAuthentication" -Value 1
        shell: pwsh

      - name: Set password for runneradmin
        run: |
          $Password = ConvertTo-SecureString "P@ssw0rd123!" -AsPlainText -Force
          Set-LocalUser -Name "runneradmin" -Password $Password
        shell: pwsh

      - name: Start ngrok TCP tunnel on 3389
        run: |
          Start-Process -NoNewWindow -FilePath ngrok\ngrok.exe -ArgumentList "tcp 3389"
          Start-Sleep -Seconds 5
          $tunnel = Invoke-RestMethod http://127.0.0.1:4040/api/tunnels
          $publicUrl = $tunnel.tunnels[0].public_url
          Write-Host "🌐 Connect to this RDP address: $($publicUrl.Replace('tcp://', ''))"
        shell: pwsh
